name: Instagram insights

# Once a day, snapshot follower count and each recent Reel's metrics (views, reach, watch time,
# shares, saves, skip rate...) into posting/account.csv and posting/metrics.csv.

on:
  schedule:
    - cron: "41 14 * * *" # 14:41 UTC daily, before the next post goes out
  workflow_dispatch:

concurrency:
  group: instagram-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  insights:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_API_BASE: ${{ vars.IG_API_BASE }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch insights
        run: |
          if [ -z "$IG_ACCESS_TOKEN" ] || [ -z "$IG_USER_ID" ]; then
            echo "::notice::IG secrets not set yet; skipping."; exit 0
          fi
          python3 posting/post.py insights

      - name: Save snapshots
        run: |
          git add -N posting/*.csv 2>/dev/null || true
          git diff --quiet -- posting/ && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add posting/*.csv
          git commit -m "Instagram: insights snapshot"
          for i in 1 2 3; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep 5; done
          exit 1
