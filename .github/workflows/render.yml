name: Render episode

# Cloud render: nothing runs on the creator's computer. Public repos get standard runners free.
on:
  workflow_dispatch:
    inputs:
      episode:
        description: Episode id (folder under episodes/)
        required: true
        default: ep01
      voice_provider:
        description: kokoro (free, open-source) or elevenlabs (needs ELEVENLABS_API_KEY secret)
        required: true
        default: kokoro
  push:
    paths:
      - "episodes/**"
      - "src/**"
      - "pipeline/**"
      - "series/**"
      - ".github/workflows/render.yml"

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      HF_HOME: ${{ github.workspace }}/.cache/hf
    steps:
      - uses: actions/checkout@v4

      - name: Pick episode
        id: ep
        run: |
          if [ -n "${{ inputs.episode }}" ]; then EP="${{ inputs.episode }}"; else
            # On push, render the most recently changed episode (falls back to the newest folder).
            EP=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -oE '^episodes/[^/]+' | head -1 | cut -d/ -f2 || true)
            [ -z "$EP" ] && EP=$(ls episodes | sort | tail -1)
          fi
          echo "id=$EP" >> "$GITHUB_OUTPUT"
          echo "provider=${{ inputs.voice_provider || 'kokoro' }}" >> "$GITHUB_OUTPUT"
        shell: bash

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/cache@v4
        with:
          path: .cache/hf
          key: hf-kokoro-v1

      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng

      - name: Python deps (CPU-only torch)
        run: pip install -r pipeline/requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Node deps
        run: npm ci && npx remotion browser ensure

      - name: Narration, score, mix
        run: pipeline/build.sh "${{ steps.ep.outputs.id }}" --provider "${{ steps.ep.outputs.provider }}"

      - name: Render MP4
        run: npx remotion render Episode "out/${{ steps.ep.outputs.id }}.mp4" --props="{\"episodeId\":\"${{ steps.ep.outputs.id }}\"}"

      - name: QA
        run: python pipeline/qa.py "out/${{ steps.ep.outputs.id }}.mp4" --sheet "out/${{ steps.ep.outputs.id }}_sheet.jpg"

      - name: Upload video + QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ep.outputs.id }}-render
          path: |
            out/
            public/${{ steps.ep.outputs.id }}/timing.json
            public/${{ steps.ep.outputs.id }}/mix_report.json
          retention-days: 30
